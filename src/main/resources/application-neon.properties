# Ativar com SPRING_PROFILES_ACTIVE=neon no Render.
# DB_URL deve ser uma URL JDBC direta do Neon com sslmode=require.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# O banco remoto ja possui tabelas e dados: nao executar schema.sql nem data.sql.
spring.sql.init.mode=never
# Limitar conexoes em instancias pequenas / plano gratuito.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
