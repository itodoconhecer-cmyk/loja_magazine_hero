spring.application.name=loja-magazine-hero
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loja_magazine_hero}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.port=${PORT:8080}

# Resource Server JWT.
# Em producao, configure issuer e JWKS do provedor de identidade.
# Informar jwk-set-uri evita dependencia de discovery remoto no startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${APP_JWT_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${APP_JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.audiences=${APP_JWT_AUDIENCE:loja-magazine-hero}

# Logging operacional. Padrao: um conjunto de arquivos por dia.
app.logging.dir=${APP_LOG_DIR:logs}
app.logging.period-pattern=${APP_LOG_PERIOD_PATTERN:yyyy-MM-dd}
app.logging.max-history=${APP_LOG_MAX_HISTORY:30}
app.logging.max-file-size=${APP_LOG_MAX_FILE_SIZE:50MB}
