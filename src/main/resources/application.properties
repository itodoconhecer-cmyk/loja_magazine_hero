spring.application.name=loja-magazine-hero
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loja_magazine_hero}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.port=${PORT:8080}

# JWT HS256. Em producao, APP_JWT_SECRET deve ser obrigatoriamente substituido.
app.security.jwt-secret=${APP_JWT_SECRET:local-development-secret-change-me-2026}

# Logging operacional. Padrao: um arquivo por dia.
app.logging.dir=${APP_LOG_DIR:logs}
app.logging.period-pattern=${APP_LOG_PERIOD_PATTERN:yyyy-MM-dd}
app.logging.max-history=${APP_LOG_MAX_HISTORY:30}
app.logging.max-file-size=${APP_LOG_MAX_FILE_SIZE:50MB}
