name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validar formatacao
        run: mvn -B spotless:check

      - name: Testes
        run: mvn -B test

      - name: Empacotar
        run: mvn -B -DskipTests package
