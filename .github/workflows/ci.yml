name: CI - Loja Magazine Hero

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Formatacao, testes e imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validar formatacao
        run: mvn -B -ntp spotless:check
      - name: Testar e empacotar
        run: mvn -B -ntp clean verify
      - name: Relatorios JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Docker
        run: docker build -t loja-magazine-hero:${{ github.sha }} .

  deploy_render:
    name: Deploy Render (opt-in apos CI)
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.ENABLE_RENDER_AUTODEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Acionar deploy no Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK" || { echo 'Secret RENDER_DEPLOY_HOOK_URL ausente'; exit 1; }
          curl --fail --silent --show-error --max-time 30 --request POST "$DEPLOY_HOOK" > /dev/null
          echo 'Deploy solicitado; validar estado e saude no Render.'
