services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loja_magazine_hero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - loja_magazine_hero_pg:/var/lib/postgresql/data
volumes:
  loja_magazine_hero_pg:
